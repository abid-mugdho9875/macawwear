# Netlify build + functions config.
# Frontend: Vite build → "dist".
# Backend: TypeScript → "netlify/functions/lib" (compiled JS for Netlify).

[build]
  command = "npm run typecheck && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # Bundle each function so the deploy is self-contained.
  node_bundler = "esbuild"

# Single-page-app fallback so client routes work on hard reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — keep these tight.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"